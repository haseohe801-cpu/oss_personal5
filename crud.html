<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Management</title>

    <style>
        body {
            font-family: Arial;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }
    </style>
</head>

<body>
<h1>Product Management</h1>

    <form id="productForm">
        <input type="text" id="name" placeholder="상품명">

        <select id="category">
            <option value="">카테고리 선택</option>
            <option value="electronics">Food</option>
            <option value="clothing">Electronics</option>
            <option value="books">Clothing</option>
        </select>

        <input type="number" id="price" placeholder="가격">
        <input type="number" id="stock" placeholder="재고">
        <button type="submit" id="saveBtn">add</button>
    </form>

<table>
    <thead>
        <tr>
            <th>id</th>
            <th>상품명</th>
            <th>카테고리</th>
            <th>가격</th>
            <th>재고</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="productList"></tbody>
</table>

<script>
    let products = [
        {id: 1, name: "Keyboard", category: "Electronics", price: 30000, stock: 10},
        {id: 2, name: "T-shirt", category: "Clothing", price: 20000, stock: 20},
        {id: 3, name: "Ramen", category: "Food", price: 5000, stock: 50}
    ];

    let editId = null;

    const form = document.getElementById('productForm');
    const nameInput = document.getElementById('name');
    const categoryInput = document.getElementById('category');
    const priceInput = document.getElementById('price');
    const stockInput = document.getElementById('stock');
    const list = document.getElementById('productList');
    const saveBtn = document.getElementById('saveBtn');


    function render(){
        list.innerHTML = "";

        products.forEach(function(product) {
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${product.id}</td>
                <td>${product.name}</td>
                <td>${product.category}</td>
                <td>${product.price}</td>
                <td>${product.stock}</td>
                <td>
                    <button class="edit" onclick="editProduct(${product.id})">수정</button>
                    <button class="delete" onclick="deleteProduct(${product.id})">삭제</button>
                </td>
            `;

            list.appendChild(row);
        });
    }

    form.addEventListener('submit', function(event) {
        event.preventDefault();

        if (nameInput.value.trim() === "") {
            alert("상품명을 입력하세요.");
            nameInput.focus();
            return;
        }
        if (categoryInput.value === "") {
            alert("카테고리를 선택하세요.");
            categoryInput.focus();
            return;
        }
        if (priceInput.value === "") {
            alert("가격을 입력하세요.");
            priceInput.focus();
            return;
        }
        if (stockInput.value === "") {
            alert("재고를 입력하세요.");
            stockInput.focus();
            return;
        }
        if (editId === null) {
        products.push({
            id: products.length > 0 ? products[products.length - 1].id + 1 : 1,
            name: nameInput.value,
            category: categoryInput.value,
            price: Number(priceInput.value),
            stock: Number(stockInput.value)
        });
        } else {
            const product = products.find(function(product) {
            return product.id === editId;
        });

        product.name = nameInput.value;
        product.category = categoryInput.value;
        product.price = Number(priceInput.value);
        product.stock = Number(stockInput.value);

        editId = null;
        saveBtn.innerText = "Add";
    }
        form.reset();
        render();
    });

    function editProduct(id) {
        const product = products.find(function(product) {
            return product.id === id;
        });

        nameInput.value = product.name;
        categoryInput.value = product.category;
        priceInput.value = product.price;
        stockInput.value = product.stock;

        editId = id;
        saveBtn.innerText = "Save";
    }

    function deleteProduct(id) {
        products = products.filter(function(product) {
            return product.id !== id;
        });
        render();
    }

render();
</script>

</body>
</html>
